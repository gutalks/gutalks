<script>

    // ==========================================
    // ESTADO
    // ==========================================

    let usuarioLogado = null;

    let alunoDados = null;

    let todasAtividades = [];

    let programacaoCache = {};

    let cicloSelecionado = null;

    let semanaSelecionada = null;


    // ==========================================
    // DIAS DA SEMANA
    // ==========================================

    const nomesDias = {
        1: "Segunda-feira",
        2: "Terça-feira",
        3: "Quarta-feira",
        4: "Quinta-feira",
        5: "Sexta-feira",
        6: "Sábado",
        7: "Domingo"
    };


    // ==========================================
    // TIPOS
    // ==========================================

    function nomeTipo(tipo) {

        const tipos = {

            aula: "Aula",

            exercicio: "Exercício",

            exercicios: "Exercícios",

            flashcards: "Flashcards",

            pronuncia: "Pronúncia",

            material: "Material",

            leitura: "Leitura",

            listening: "Listening",

            speaking: "Speaking",

            writing: "Writing",

            gramatica: "Gramática"

        };

        return tipos[tipo] || tipo || "Atividade";
    }


    // ==========================================
    // ESCAPAR HTML
    // ==========================================

    function escaparHTML(valor) {

        if (valor === null || valor === undefined) {
            return "";
        }

        return String(valor)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // ==========================================
    // RENDERIZAR CICLOS
    // ==========================================

    function renderizarCiclos() {

        cicloSelecionado = null;
        semanaSelecionada = null;

        const ciclos = [
            ...new Set(
                todasAtividades
                    .map(atividade => Number(atividade.ciclo))
                    .filter(ciclo => !isNaN(ciclo))
            )
        ].sort((a, b) => a - b);


        document.getElementById(
            "tituloSecao"
        ).textContent =
            "Seus ciclos";


        document.getElementById(
            "subtituloSecao"
        ).textContent =
            "Selecione um ciclo para visualizar as semanas estudadas.";


        const container =
            document.getElementById(
                "conteudoHistorico"
            );


        if (ciclos.length === 0) {

            container.innerHTML = `
                <div class="vazio">
                    Nenhum histórico de estudos
                    foi encontrado.
                </div>
            `;

            atualizarNavegacao();

            return;
        }


        container.innerHTML =
            ciclos.map(ciclo => {

                const quantidadeSemanas =
                    new Set(
                        todasAtividades
                            .filter(
                                atividade =>
                                    Number(atividade.ciclo) === ciclo
                            )
                            .map(
                                atividade =>
                                    Number(atividade.semana)
                            )
                    ).size;


                return `

                    <div
                        class="card"
                        onclick="selecionarCiclo(${ciclo})">

                        <div class="card-icon">
                            📁
                        </div>

                        <h2>
                            Ciclo ${ciclo}
                        </h2>

                        <p>
                            ${quantidadeSemanas}
                            ${
                                quantidadeSemanas === 1
                                    ? "semana registrada"
                                    : "semanas registradas"
                            }
                        </p>

                    </div>

                `;

            }).join("");


        atualizarNavegacao();
    }


    // ==========================================
    // SELECIONAR CICLO
    // ==========================================

    function selecionarCiclo(ciclo) {

        cicloSelecionado = ciclo;

        semanaSelecionada = null;


        const semanas = [
            ...new Set(
                todasAtividades
                    .filter(
                        atividade =>
                            Number(atividade.ciclo) === ciclo
                    )
                    .map(
                        atividade =>
                            Number(atividade.semana)
                    )
                    .filter(
                        semana => !isNaN(semana)
                    )
            )
        ].sort((a, b) => a - b);


        document.getElementById(
            "tituloSecao"
        ).textContent =
            `Ciclo ${ciclo}`;


        document.getElementById(
            "subtituloSecao"
        ).textContent =
            "Selecione uma semana para visualizar a programação.";


        const container =
            document.getElementById(
                "conteudoHistorico"
            );


        if (semanas.length === 0) {

            container.innerHTML = `
                <div class="vazio">
                    Nenhuma semana encontrada
                    neste ciclo.
                </div>
            `;

            atualizarNavegacao();

            return;
        }


        container.innerHTML =
            semanas.map(semana => {

                const quantidadeAtividades =
                    todasAtividades.filter(
                        atividade =>
                            Number(atividade.ciclo) === ciclo &&
                            Number(atividade.semana) === semana
                    ).length;


                return `

                    <div
                        class="semana-card"
                        onclick="
                            selecionarSemana(
                                ${ciclo},
                                ${semana}
                            )
                        ">

                        <div class="card-icon">
                            📂
                        </div>

                        <h2>
                            Semana ${semana}
                        </h2>

                        <p>
                            ${quantidadeAtividades}
                            ${
                                quantidadeAtividades === 1
                                    ? "atividade registrada"
                                    : "atividades registradas"
                            }
                        </p>

                    </div>

                `;

            }).join("");


        atualizarNavegacao();
    }


    // ==========================================
    // SELECIONAR SEMANA
    // ==========================================

    function selecionarSemana(
        ciclo,
        semana
    ) {

        cicloSelecionado = ciclo;

        semanaSelecionada = semana;


        const atividades =
            todasAtividades.filter(
                atividade =>
                    Number(atividade.ciclo) === ciclo &&
                    Number(atividade.semana) === semana
            );


        document.getElementById(
            "tituloSecao"
        ).textContent =
            `Ciclo ${ciclo} • Semana ${semana}`;


        document.getElementById(
            "subtituloSecao"
        ).textContent =
            "Programação de estudos desta semana.";


        renderizarProgramacao(
            atividades
        );


        atualizarNavegacao();
    }


    // ==========================================
    // RENDERIZAR PROGRAMAÇÃO
    // ==========================================

    function renderizarProgramacao(
        atividades
    ) {

        const container =
            document.getElementById(
                "conteudoHistorico"
            );


        programacaoCache = {};


        if (!atividades.length) {

            container.innerHTML = `
                <div class="vazio">
                    Nenhuma atividade encontrada
                    nesta semana.
                </div>
            `;

            return;
        }


        const dias = [
            1,
            2,
            3,
            4,
            5,
            6,
            7
        ];


        container.className = "";


        container.innerHTML =
            dias.map(dia => {

                const atividadesDoDia =
                    atividades.filter(
                        atividade =>
                            Number(
                                atividade.dia_semana
                            ) === dia
                    );


                if (
                    atividadesDoDia.length === 0
                ) {

                    return `
                        <div class="dia">

                            <h3 class="dia-titulo">
                                ${nomesDias[dia]}
                            </h3>

                            <div class="atividade-semana">

                                <div
                                    class="atividade-semana-info">

                                    <div
                                        class="atividade-semana-tipo">
                                        Sem atividade programada
                                    </div>

                                </div>

                            </div>

                        </div>
                    `;
                }


                return `

                    <div class="dia">

                        <h3 class="dia-titulo">
                            ${nomesDias[dia]}
                        </h3>

                        ${
                            atividadesDoDia
                                .map(
                                    atividade =>
                                        renderizarAtividade(
                                            atividade
                                        )
                                )
                                .join("")
                        }

                    </div>

                `;

            }).join("");
    }


    // ==========================================
    // RENDERIZAR ATIVIDADE
    // ==========================================

    function renderizarAtividade(
        atividade
    ) {

        programacaoCache[
            atividade.id
        ] = atividade;


        const concluida =
            Boolean(
                atividade.concluida
            );


        const classeConcluida =
            concluida
                ? "concluida"
                : "";


        let botaoAcesso;


        if (
            atividade.link ===
            "flashcards.html"
        ) {

            botaoAcesso = `

                <a
                    class="abrir-semana-btn"
                    href="flashcards.html">

                    🧠 Acessar

                </a>

            `;

        }
        else {

            botaoAcesso = `

                <button
                    class="abrir-semana-btn"
                    onclick="
                        abrirAtividade(
                            ${atividade.id}
                        )
                    ">

                    ${
                        atividade.link ||
                        atividade.tipo === "pronuncia"
                            ? "🔗 Acessar"
                            : "👁️ Ver"
                    }

                </button>

            `;
        }


        return `

            <div
                class="
                    atividade-semana
                    ${classeConcluida}
                ">

                <div
                    class="
                        atividade-semana-info
                    ">

                    <div
                        class="
                            atividade-semana-tipo
                        ">

                        ${escaparHTML(
                            nomeTipo(
                                atividade.tipo
                            )
                        )}

                        ${
                            concluida
                                ? " • CONCLUÍDA"
                                : ""
                        }

                    </div>


                    <div
                        class="
                            atividade-semana-titulo
                        ">

                        ${escaparHTML(
                            atividade.titulo
                        )}

                    </div>


                    ${
                        atividade.descricao
                            ? `

                                <div
                                    class="
                                        atividade-semana-descricao
                                    ">

                                    ${escaparHTML(
                                        atividade.descricao
                                    )}

                                </div>

                            `
                            : ""
                    }

                </div>


                ${botaoAcesso}

            </div>

        `;
    }


    // ==========================================
    // NAVEGAÇÃO
    // ==========================================

    function atualizarNavegacao() {

        const navegacao =
            document.getElementById(
                "navegacao"
            );


        navegacao.style.display =
            "block";


        if (
            cicloSelecionado === null
        ) {

            navegacao.innerHTML = `
                <button
                    onclick="renderizarCiclos()">

                    Histórico

                </button>
            `;

            return;
        }


        if (
            semanaSelecionada === null
        ) {

            navegacao.innerHTML = `

                <button
                    onclick="renderizarCiclos()">

                    Histórico

                </button>

                &nbsp; / &nbsp;

                <button
                    onclick="
                        selecionarCiclo(
                            ${cicloSelecionado}
                        )
                    ">

                    Ciclo ${cicloSelecionado}

                </button>

            `;

            return;
        }


        navegacao.innerHTML = `

            <button
                onclick="renderizarCiclos()">

                Histórico

            </button>

            &nbsp; / &nbsp;

            <button
                onclick="
                    selecionarCiclo(
                        ${cicloSelecionado}
                    )
                ">

                Ciclo ${cicloSelecionado}

            </button>

            &nbsp; / &nbsp;

            <button
                onclick="
                    selecionarSemana(
                        ${cicloSelecionado},
                        ${semanaSelecionada}
                    )
                ">

                Semana ${semanaSelecionada}

            </button>

        `;
    }


    // ==========================================
    // ABRIR ATIVIDADE
    // ==========================================

    function abrirAtividade(id) {

        const atividade =
            programacaoCache[id];


        if (!atividade) {

            console.error(
                "Atividade não encontrada:",
                id
            );

            return;
        }


        // ==========================================
        // FLASHCARDS
        // ==========================================

        if (
            atividade.link ===
            "flashcards.html"
        ) {

            window.location.href =
                "flashcards.html";

            return;
        }


        const modal =
            document.getElementById(
                "modalAtividade"
            );

        const embed =
            document.getElementById(
                "modalEmbed"
            );

        const aviso =
            document.getElementById(
                "modalAviso"
            );

        const acoes =
            document.getElementById(
                "modalAcoes"
            );


        embed.innerHTML = "";

        embed.style.display =
            "none";


        aviso.innerHTML = "";

        aviso.style.display =
            "none";


        acoes.innerHTML = "";


        document.getElementById(
            "modalTipo"
        ).textContent =
            nomeTipo(
                atividade.tipo
            );


        document.getElementById(
            "modalTitulo"
        ).textContent =
            atividade.titulo || "";


        document.getElementById(
            "modalDescricao"
        ).textContent =
            (
                atividade.descricao ||
                ""
            ).trim();


        // ==========================================
        // LINK
        // ==========================================

        if (
            atividade.link
        ) {

            const embedData =
                obterUrlEmbed(
                    atividade.link
                );


            if (
                embedData &&
                embedData.url
            ) {

                embed.innerHTML = `

                    <iframe
                        src="${escaparHTML(
                            embedData.url
                        )}"
                        allowfullscreen>
                    </iframe>

                `;

                embed.style.display =
                    "block";

            }
            else {

                acoes.innerHTML = `

                    <a
                        class="abrir-semana-btn"
                        href="${escaparHTML(
                            atividade.link
                        )}"
                        target="_blank"
                        rel="noopener noreferrer">

                        🔗 Abrir conteúdo

                    </a>

                `;
            }
        }


        // ==========================================
        // CONCLUSÃO
        // ==========================================

        acoes.innerHTML += `

            <button
                class="
                    modal-botao
                    ${
                        atividade.concluida
                            ? "vermelho"
                            : "verde"
                    }
                "
                onclick="
                    alternarConclusao(
                        ${atividade.id},
                        ${Boolean(
                            atividade.concluida
                        )}
                    )
                ">

                ${
                    atividade.concluida
                        ? "↩️ Marcar como não concluída"
                        : "✅ Marcar como concluída"
                }

            </button>

        `;


        modal.classList.add(
            "ativo"
        );
    }


    // ==========================================
    // URL PARA EMBED
    // ==========================================

    function obterUrlEmbed(url) {

        if (!url) {
            return null;
        }


        // YouTube

        const youtubeMatch =
            url.match(
                /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&?/]+)/
            );


        if (youtubeMatch) {

            return {
                url:
                    `https://www.youtube.com/embed/${youtubeMatch[1]}`
            };
        }


        // Google Drive

        if (
            url.includes(
                "drive.google.com"
            )
        ) {

            const match =
                url.match(
                    /\/d\/([^/]+)/
                );


            if (match) {

                return {
                    url:
                        `https://drive.google.com/file/d/${match[1]}/preview`
                };
            }
        }


        // Google Docs

        if (
            url.includes(
                "docs.google.com"
            )
        ) {

            return {
                url: url
            };
        }


        return null;
    }


    // ==========================================
    // CONCLUSÃO
    // ==========================================

    async function alternarConclusao(
        id,
        concluidaAtual
    ) {

        const novaConclusao =
            !concluidaAtual;


        const {
            error
        } = await supabaseClient
            .from(
                "programacao_semanal"
            )
            .update({
                concluida:
                    novaConclusao
            })
            .eq(
                "id",
                id
            )
            .eq(
                "user_id",
                usuarioLogado.id
            );


        if (error) {

            console.error(
                "Erro ao atualizar conclusão:",
                error
            );

            alert(
                "Não foi possível atualizar a atividade."
            );

            return;
        }


        const atividade =
            programacaoCache[id];


        if (atividade) {

            atividade.concluida =
                novaConclusao;
        }


        const indice =
            todasAtividades.findIndex(
                atividade =>
                    atividade.id === id
            );


        if (
            indice !== -1
        ) {

            todasAtividades[
                indice
            ].concluida =
                novaConclusao;
        }


        fecharModal();


        selecionarSemana(
            cicloSelecionado,
            semanaSelecionada
        );
    }


    // ==========================================
    // MODAL
    // ==========================================

    function fecharModal() {

        const modal =
            document.getElementById(
                "modalAtividade"
            );


        modal.classList.remove(
            "ativo"
        );


        document.getElementById(
            "modalEmbed"
        ).innerHTML = "";


        document.getElementById(
            "modalEmbed"
        ).style.display =
            "none";
    }


    function fecharModalFora(event) {

        if (
            event.target.id ===
            "modalAtividade"
        ) {

            fecharModal();
        }
    }


    // ==========================================
    // CARREGAR HISTÓRICO
    // ==========================================

    async function carregarHistorico() {

        const {
            data,
            error
        } = await supabaseClient
            .from(
                "programacao_semanal"
            )
            .select("*")
            .eq(
                "user_id",
                usuarioLogado.id
            )
            .order(
                "ciclo",
                {
                    ascending: true
                }
            )
            .order(
                "semana",
                {
                    ascending: true
                }
            )
            .order(
                "dia_semana",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "Erro ao carregar histórico:",
                error
            );


            document.getElementById(
                "conteudoHistorico"
            ).innerHTML = `

                <div class="vazio">

                    Não foi possível carregar
                    seu histórico de estudos.

                </div>

            `;

            return;
        }


        todasAtividades =
            data || [];


        renderizarCiclos();
    }


    // ==========================================
    // VERIFICAR ALUNO
    // ==========================================

    async function verificarAluno() {

        const {
            data: {
                session
            }
        } =
            await supabaseClient
                .auth
                .getSession();


        if (!session) {

            window.location.href =
                "index.html";

            return;
        }


        usuarioLogado =
            session.user;


        const {
            data: aluno,
            error
        } =
            await supabaseClient
                .from("Alunos")
                .select(
                    "nome, email"
                )
                .eq(
                    "user_id",
                    session.user.id
                )
                .single();


        if (
            error
        ) {

            console.error(
                "Erro ao carregar aluno:",
                error
            );

            document.getElementById(
                "nomeAluno"
            ).textContent =
                session.user.email || "";

        }
        else {

            alunoDados =
                aluno;

            document.getElementById(
                "nomeAluno"
            ).textContent =
                aluno.nome ||
                aluno.email ||
                session.user.email;
        }


        await carregarHistorico();
    }


    // ==========================================
    // LOGOUT
    // ==========================================

    async function logout() {

        await supabaseClient
            .auth
            .signOut();


        window.location.href =
            "index.html";
    }


    // ==========================================
    // INICIALIZAÇÃO
    // ==========================================

    document.addEventListener(
        "DOMContentLoaded",
        verificarAluno
    );

</script>
