<header>

    <div class="logo">
        GUTALKS
    </div>

    <a href="Aulas.html" class="back-button">
        ← Voltar para aulas
    </a>

</header>


<main>

    <div id="conteudoAula">

        <div class="mensagem">
            Carregando aula...
        </div>

    </div>

</main>


<footer>
    © 2026 Gutalks — Área do aluno
</footer>


<script>

    async function carregarAula() {

        // Verificar se o aluno está logado
        const { data: { session } } =
            await supabaseClient.auth.getSession();

        if (!session) {
            window.location.href = "login.html";
            return;
        }


        // Pegar o ID da aula na URL
        const parametros = new URLSearchParams(window.location.search);

        const idAula = parametros.get("id");


        const container =
            document.getElementById("conteudoAula");


        // Verificar se existe ID
        if (!idAula) {

            container.innerHTML = `
                <div class="mensagem">
                    Não foi possível identificar a aula.
                </div>
            `;

            return;
        }


        // Buscar a aula no Supabase
        const { data: aula, error } =
            await supabaseClient
                .from("Aulas")
                .select("*")
                .eq("id", idAula)
                .single();


        // Verificar erro
        if (error) {

            console.error("Erro ao carregar aula:", error);

            container.innerHTML = `
                <div class="mensagem">
                    <strong>Erro ao carregar a aula.</strong>
                    <br><br>
                    ${error.message}
                </div>
            `;

            return;
        }


        // Mostrar aula
        container.innerHTML = `

            <article class="aula-container">

                <div class="numero">
                    AULA ${aula.numero}
                </div>

                <h1>
                    ${aula.titulo}
                </h1>

                <p class="descricao">
                    ${aula.descricao}
                </p>

                <div class="conteudo">

                    <h2>Conteúdo da aula</h2>

                    <br>

                    <p>
                        O conteúdo desta aula será disponibilizado aqui.
                    </p>

                </div>

            </article>

        `;

    }


    carregarAula();

</script>
```
