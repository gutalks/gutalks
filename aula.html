```
<header>

    <div class="logo">
        GUTALKS
    </div>

    <a href="Aulas.html" class="back-button">
        ← Voltar para aulas
    </a>

</header>


<main>

    <div id="conteudoAula">

        <div class="mensagem">
            Carregando aula...
        </div>

    </div>

</main>


<footer>
    © 2026 Gutalks — Área do aluno
</footer>


<script>

    async function carregarAula() {

        // Verificar se o aluno está logado
        const { data: { session } } =
            await supabaseClient.auth.getSession();

        if (!session) {
            window.location.href = "login.html";
            return;
        }


        // Pegar o ID da aula na URL
        const parametros =
            new URLSearchParams(window.location.search);

        const idAula =
            parametros.get("id");


        const container =
            document.getElementById("conteudoAula");


        // Verificar se existe ID
        if (!idAula) {

            container.innerHTML = `
                <div class="mensagem">
                    Não foi possível identificar a aula.
                </div>
            `;

            return;
        }


        // Buscar a aula
        const { data: aula, error: erroAula } =
            await supabaseClient
                .from("Aulas")
                .select("*")
                .eq("id", idAula)
                .single();


        // Verificar erro da aula
        if (erroAula) {

            console.error(
                "Erro ao carregar aula:",
                erroAula
            );

            container.innerHTML = `
                <div class="mensagem">
                    <strong>
                        Erro ao carregar a aula.
                    </strong>

                    <br><br>

                    ${erroAula.message}
                </div>
            `;

            return;
        }


        // Buscar materiais relacionados à aula
        const { data: materiais, error: erroMateriais } =
            await supabaseClient
                .from("Materiais")
                .select("*")
                .eq("aula_id", idAula)
                .order("created_at", { ascending: true });


        // Verificar erro dos materiais
        if (erroMateriais) {

            console.error(
                "Erro ao carregar materiais:",
                erroMateriais
            );

            container.innerHTML = `
                <div class="mensagem">
                    <strong>
                        A aula foi encontrada, mas não foi possível carregar os materiais.
                    </strong>

                    <br><br>

                    ${erroMateriais.message}
                </div>
            `;

            return;
        }


        // Criar área de materiais
        let materiaisHTML = "";


        if (!materiais || materiais.length === 0) {

            materiaisHTML = `
                <div class="mensagem">
                    Nenhum material disponível para esta aula no momento.
                </div>
            `;

        } else {

            materiais.forEach(material => {

                materiaisHTML += `

                    <div class="material">

                        <div class="material-tipo">
                            ${material.tipo}
                        </div>

                        <h3>
                            ${material.titulo}
                        </h3>

                        <a
                            href="${material.url}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="material-botao"
                        >
                            Acessar material
                        </a>

                    </div>

                `;

            });

        }


        // Mostrar aula e materiais
        container.innerHTML = `

            <article class="aula-container">

                <div class="numero">
                    AULA ${aula.numero}
                </div>

                <h1>
                    ${aula.titulo}
                </h1>

                <p class="descricao">
                    ${aula.descricao}
                </p>


                <div class="conteudo">

                    <h2>
                        📚 Materiais da aula
                    </h2>

                    ${materiaisHTML}

                </div>

            </article>

        `;

    }


    carregarAula();

</script>
```
