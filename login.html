<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUTALKS | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #c82623;
            font-size: 42px;
            margin-bottom: 5px;
        }

        .logo p {
            color: #163075;
            font-size: 14px;
        }

        .profile-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .profile-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #163075;
            background: white;
            color: #163075;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .profile-btn.active {
            background: #163075;
            color: white;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #163075;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #c82623;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #a91f1c;
        }

        .login-btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .error-message {
            margin-top: 15px;
            padding: 12px;
            background: #ffe5e5;
            color: #b00000;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .success-message {
            margin-top: 15px;
            padding: 12px;
            background: #e5f7e5;
            color: #146b14;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #163075;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <h1>GUTALKS</h1>
            <p>Speak more. Fear less.</p>
        </div>

        <div class="profile-selector">
            <button type="button" class="profile-btn active" id="alunoBtn">
                Aluno
            </button>

            <button type="button" class="profile-btn" id="professorBtn">
                Professor
            </button>
        </div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Entrar
            </button>

        </form>

        <div class="error-message" id="errorMessage"></div>

        <div class="success-message" id="successMessage"></div>

        <a href="index.html" class="back-link">
            ← Voltar para a página inicial
        </a>

    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>

    <!-- TESTE DE CONEXÃO DO CLIENTE SUPABASE -->
    <script>
        console.log("=== TESTE GUTALKS / SUPABASE ===");
        console.log("supabaseClient:", supabaseClient);

        supabaseClient.auth.getSession()
            .then(function(resultado) {
                console.log("TESTE GET SESSION:", resultado);
            })
            .catch(function(error) {
                console.error("ERRO GET SESSION:", error);
            });
    </script>

    <script>
        let perfilSelecionado = "aluno";

        const alunoBtn = document.getElementById("alunoBtn");
        const professorBtn = document.getElementById("professorBtn");
        const loginForm = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");
        const errorMessage = document.getElementById("errorMessage");
        const successMessage = document.getElementById("successMessage");

        alunoBtn.addEventListener("click", function() {
            perfilSelecionado = "aluno";

            alunoBtn.classList.add("active");
            professorBtn.classList.remove("active");

            limparMensagens();
        });

        professorBtn.addEventListener("click", function() {
            perfilSelecionado = "professor";

            professorBtn.classList.add("active");
            alunoBtn.classList.remove("active");

            limparMensagens();
        });

        function limparMensagens() {
            errorMessage.style.display = "none";
            successMessage.style.display = "none";
            errorMessage.textContent = "";
            successMessage.textContent = "";
        }

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            limparMensagens();

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;

            loginBtn.disabled = true;
            loginBtn.textContent = "Entrando...";

            try {

                console.log("=== INÍCIO DO LOGIN ===");
                console.log("E-mail:", email);
                console.log("Perfil:", perfilSelecionado);

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: senha
                    });

                if (error) {
                    console.error("ERRO REAL DO SUPABASE:", error);
                    throw new Error(error.message);
                }

                console.log("LOGIN REALIZADO:", data);

                const user = data.user;

                if (!user) {
                    throw new Error("Usuário não encontrado após o login.");
                }

                const userId = user.id;

                console.log("USER ID:", userId);

                /*
                 * =====================================================
                 * ALUNO
                 * =====================================================
                 */

                if (perfilSelecionado === "aluno") {

                    console.log("Buscando aluno na tabela Alunos...");

                    const { data: aluno, error: alunoError } =
                        await supabaseClient
                            .from("Alunos")
                            .select("id")
                            .eq("user_id", userId)
                            .maybeSingle();

                    if (alunoError) {
                        console.error(
                            "ERRO AO BUSCAR ALUNO:",
                            alunoError
                        );

                        throw new Error(
                            "Erro ao verificar o cadastro do aluno: " +
                            alunoError.message
                        );
                    }

                    if (!aluno) {
                        throw new Error(
                            "Este usuário está autenticado, mas não foi encontrado como aluno."
                        );
                    }

                    console.log("ALUNO ENCONTRADO:", aluno);

                    successMessage.textContent =
                        "Login realizado! Redirecionando...";

                    successMessage.style.display = "block";

                    setTimeout(function() {
                        window.location.href = "aluno.html";
                    }, 500);
                }

                /*
                 * =====================================================
                 * PROFESSOR
                 * =====================================================
                 */

                else {

                    console.log(
                        "Buscando professor na tabela Professores..."
                    );

                    const { data: professor, error: professorError } =
                        await supabaseClient
                            .from("Professores")
                            .select("id, ativo")
                            .eq("user_id", userId)
                            .maybeSingle();

                    if (professorError) {
                        console.error(
                            "ERRO AO BUSCAR PROFESSOR:",
                            professorError
                        );

                        throw new Error(
                            "Erro ao verificar o cadastro do professor: " +
                            professorError.message
                        );
                    }

                    if (!professor) {
                        throw new Error(
                            "Este usuário está autenticado, mas não foi encontrado como professor."
                        );
                    }

                    if (professor.ativo === false) {
                        throw new Error(
                            "Este professor está com o acesso desativado."
                        );
                    }

                    console.log(
                        "PROFESSOR ENCONTRADO:",
                        professor
                    );

                    successMessage.textContent =
                        "Login realizado! Redirecionando...";

                    successMessage.style.display = "block";

                    setTimeout(function() {
                        window.location.href = "professor.html";
                    }, 500);
                }

            } catch (error) {

                console.error("=== ERRO FINAL DO LOGIN ===");
                console.error(error);

                errorMessage.textContent =
                    error.message || "Erro ao realizar login.";

                errorMessage.style.display = "block";

            } finally {

                loginBtn.disabled = false;
                loginBtn.textContent = "Entrar";
            }

        });
    </script>

</body>
</html>
