<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gutalks | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #163075;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 45px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            color: #163075;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666666;
            margin-bottom: 35px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #163075;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #dddddd;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #163075;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #c82623;
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #mensagem {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            min-height: 20px;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #163075;
            text-decoration: none;
        }

        .voltar:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">GUTALKS</div>

        <p class="subtitle">
            Acesse sua área do aluno
        </p>

        <form id="loginForm">

            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
                required
            >

            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
            >

            <button type="submit" id="loginButton">
                Entrar
            </button>

        </form>

        <div id="mensagem"></div>

        <a href="index.html" class="voltar">
            ← Voltar para a página inicial
        </a>

    </div>

    <!-- Biblioteca oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Nossa configuração do Supabase -->
    <script src="js/supabase.js"></script>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const mensagem = document.getElementById("mensagem");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;

            mensagem.textContent = "Entrando...";
            mensagem.style.color = "#163075";

            loginButton.disabled = true;
            loginButton.textContent = "Entrando...";

            try {

                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: senha
                    });

                if (error) {
                    throw error;
                }

                mensagem.textContent = "Login realizado com sucesso!";
                mensagem.style.color = "#163075";

                // Redireciona para a área do aluno
                window.location.href = "aluno.html";

            } catch (error) {

                console.error("Erro no login:", error);

                mensagem.textContent =
                    "E-mail ou senha incorretos.";

                mensagem.style.color = "#c82623";

                loginButton.disabled = false;
                loginButton.textContent = "Entrar";
            }

        });
    </script>

</body>
</html>
