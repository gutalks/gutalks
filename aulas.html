<header>

    <div class="logo">
        GUTALKS
    </div>

    <a href="aluno.html" class="back-button">
        ← Voltar
    </a>

</header>


<main>

    <section class="page-title">

        <h1>Minhas Aulas 📚</h1>

        <p>
            Escolha uma aula para começar seus estudos.
        </p>

    </section>


    <section id="listaAulas">

        <div class="mensagem">
            Carregando aulas...
        </div>

    </section>

</main>


<footer>
    © 2026 Gutalks — Área do aluno
</footer>


<script>

    async function carregarAulas() {

        const { data: { session } } =
            await supabaseClient.auth.getSession();

        if (!session) {
            window.location.href = "login.html";
            return;
        }


        const { data: aulas, error } =
            await supabaseClient
                .from("Aulas")
                .select("*")
                .order("numero", { ascending: true });


        const lista = document.getElementById("listaAulas");


        if (error) {

            console.error("Erro ao carregar aulas:", error);

            lista.innerHTML = `
                <div class="mensagem">
                    <strong>Erro ao carregar as aulas.</strong>
                    <br><br>
                    ${error.message}
                </div>
            `;

            return;
        }


        if (!aulas || aulas.length === 0) {

            console.log("Nenhuma aula retornada pelo Supabase.");

            lista.innerHTML = `
                <div class="mensagem">
                    <strong>Nenhuma aula disponível no momento.</strong>
                    <br><br>
                    O sistema não encontrou nenhuma aula disponível.
                </div>
            `;

            return;
        }


        lista.innerHTML = "";


        aulas.forEach(aula => {

            const card = document.createElement("div");

            card.className = "aula";

            card.innerHTML = `
                <div class="numero">
                    AULA ${aula.numero}
                </div>

                <h2>
                    ${aula.titulo}
                </h2>

                <p>
                    ${aula.descricao}
                </p>

                <a href="aula.html?id=${aula.id}" class="botao">
                    Acessar aula
                </a>
            `;

            lista.appendChild(card);

        });

    }


    carregarAulas();

</script>
